<!DOCTYPE html>

<title>國中小英文課本 各課單字字表｜Word Mapper</title>
<meta name="description" content="國小三年級到國中三年級英文課本各課單字字表，一鍵開啟 Word Mapper 看每個字的拼字與聲音對照。" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root{
    --c-primary:#887ea6; --c-primary-deep:#5f5582; --c-primary-soft:#efecf6; --c-primary-tint:#f6f4fa;
    --c-accent:#10b981;
    --c-text:#1f2937; --c-muted:#64748b; --c-bg:#f3f1f7; --c-border:#e6e2ee;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  body{font-family:"Noto Sans TC","Noto Sans",system-ui,sans-serif;background:var(--c-bg);color:var(--c-text);line-height:1.6;font-size:16px;padding:1.2rem 0 2rem}
  .container{max-width:880px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(95,85,130,.10);overflow:hidden}
  .inner{padding:1.5rem 1.6rem 2rem}

  /* ---- 首頁標題區 ---- */
  .hero{position:relative;padding:3.2rem 1.6rem 2rem;text-align:center;color:#fff;
    background:linear-gradient(135deg,#6e6392 0%,#887ea6 55%,#a79dc4 100%);overflow:hidden}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
  .hero::before{width:260px;height:260px;right:-80px;top:-120px}
  .hero::after{width:180px;height:180px;left:-60px;bottom:-100px}
  .hero > *{position:relative}
  .eyebrow{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.18em;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:.2rem .9rem;margin-bottom:.9rem}
  .hero h1{font-size:2rem;font-weight:900;line-height:1.3;margin:0 0 .4rem;letter-spacing:.02em}
  .hero h1 small{display:block;font-size:1.05rem;font-weight:500;opacity:.92;margin-top:.3rem;letter-spacing:.08em}
  .hero .lead{color:rgba(255,255,255,.9);margin:.8rem 0 0;font-size:.98rem}
  .steps{display:flex;justify-content:center;align-items:center;gap:.45rem;flex-wrap:nowrap;margin-top:1.1rem}
  .step{display:inline-flex;align-items:center;gap:.4rem;background:rgba(255,255,255,.95);color:var(--c-primary-deep);border-radius:999px;padding:.35rem .9rem;font-size:.9rem;font-weight:700}
  .step b{display:inline-grid;place-items:center;width:1.35rem;height:1.35rem;border-radius:50%;background:var(--c-primary);color:#fff;font-size:.78rem}
  .step-arrow{color:rgba(255,255,255,.7);align-self:center;font-weight:700}
  .hero-back{position:absolute;left:1rem;top:.9rem;color:rgba(255,255,255,.9);font-size:.85rem;font-weight:700;text-decoration:none;background:rgba(0,0,0,.12);padding:.2rem .7rem;border-radius:999px}
  .hero-back:hover{background:rgba(0,0,0,.22)}

  button.back{display:inline-flex;align-items:center;gap:.3rem;margin-bottom:.9rem;color:var(--c-primary-deep);font-weight:700;background:var(--c-primary-soft);border:none;padding:.35rem .9rem;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
  button.back:hover{background:#e3dfee}

  /* ---- 年級 ---- */
  .stage{margin-bottom:1.5rem}
  .stage h2{display:flex;align-items:center;gap:.6rem;font-size:1rem;font-weight:900;color:var(--c-primary-deep);margin:0 0 .7rem;letter-spacing:.06em}
  .stage h2::after{content:"";flex:1;height:1px;background:var(--c-border)}
  .grades{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}
  .grade{border:2px solid var(--c-border);background:#fff;border-radius:16px;padding:.9rem .5rem .8rem;text-align:center;color:inherit}
  .grade .g{display:block;font-family:"Noto Sans",sans-serif;font-size:2rem;font-weight:800;line-height:1.1;color:#0f172a}
  .grade .g small{font-family:"Noto Sans TC",sans-serif;font-size:.8rem;font-weight:700;color:var(--c-muted);margin-left:.15rem}
  .pubs{display:flex;justify-content:center;gap:.35rem;margin-top:.6rem}
  .pub{display:inline-grid;place-items:center;width:2.1rem;height:2.1rem;border-radius:50%;font-size:.85rem;font-weight:700;border:2px solid var(--c-primary);background:#fff;color:var(--c-primary-deep);cursor:pointer;font-family:inherit;padding:0;transition:all .15s}
  .pub:hover:not(:disabled){background:var(--c-primary);color:#fff;transform:translateY(-1px);box-shadow:0 4px 10px rgba(136,126,166,.3)}
  .pub:disabled{border:1.5px dashed #cfcadb;color:#c4bfd2;cursor:default;background:#fbfafd}
  .grade.none{border-style:dashed;background:#faf9fc}
  .grade.none .g{color:#b4afc4}

  .tabs{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 1.4rem}
  .tab{border:2px solid var(--c-border);background:#fff;border-radius:999px;padding:.4rem 1.2rem;font-weight:700;font-size:.95rem;color:#334155;cursor:pointer;font-family:inherit;transition:all .15s}
  .tab:hover:not(:disabled){border-color:var(--c-primary);color:var(--c-primary-deep)}
  .tab[aria-selected="true"]{background:var(--c-primary);border-color:var(--c-primary);color:#fff;box-shadow:0 4px 10px rgba(136,126,166,.3)}
  .tab:disabled{opacity:.45;cursor:default;border-style:dashed}

  .book{margin-bottom:2rem}

  .lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:.9rem}
  .lesson{display:flex;flex-direction:column;gap:.55rem;border:1.5px solid var(--c-border);border-radius:14px;padding:.9rem 1rem;background:#fff;text-decoration:none;color:inherit;transition:border-color .15s,transform .1s,box-shadow .15s}
  .lesson:hover{border-color:var(--c-primary);box-shadow:0 8px 18px rgba(136,126,166,.18);transform:translateY(-2px)}
  .lesson-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .lesson-name{font-weight:900;font-size:1.08rem;color:#0f172a}
  .lesson-count{font-size:.78rem;font-weight:700;color:var(--c-primary-deep);background:var(--c-primary-soft);border-radius:999px;padding:.05rem .55rem;white-space:nowrap}
  .words{font-family:"Noto Sans",sans-serif;font-size:.88rem;color:#475569;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .open{align-self:flex-start;background:var(--c-primary);color:#fff;border-radius:10px;padding:.3rem .9rem;font-weight:700;font-size:.9rem;transition:background .15s}
  .lesson:hover .open{background:var(--c-primary-deep)}
  .empty{padding:1.5rem 1rem;text-align:center;color:var(--c-muted);background:var(--c-primary-tint);border-radius:12px}

  .note{margin-top:1.8rem;padding:.9rem 1.1rem;background:var(--c-primary-tint);border-radius:12px;font-size:.88rem;color:#475569;border:1px solid var(--c-border)}

    .lessons{grid-template-columns:1fr}
    .crumb{font-size:1.3rem}

/* ---------- 工具 ---------- */
const WM = "./";
function listUrl(title, words){
  const json = JSON.stringify({ title: title, list: words });
  const b64 = btoa(unescape(encodeURIComponent(json)));
  return WM + "?list=" + encodeURIComponent(b64);
}
function esc(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
const stageOf = g => GRADES.find(x => x.items.includes(g)).stage;
const booksFor = (g, p) => BOOKS.filter(b => b.grade === g && (!p || b.publisher === p))
                               .sort((a,b) => (a.term === "上" ? 0 : 1) - (b.term === "上" ? 0 : 1));

const $ = id => document.getElementById(id);

/* ---------- 第一層：年級 ---------- */
const GRADE_NUM = { "小三":3, "小四":4, "小五":5, "小六":6, "國一":7, "國二":8, "國三":9 };
const PUB_SHORT = { "康軒":"康", "翰林":"翰", "南一":"南", "何嘉仁":"何" };

function renderGrades(){
  $("stages").innerHTML = GRADES.map(st => `
    <div class="stage">
      <h2>${esc(st.stage)}</h2>
      <div class="grades">
        ${st.items.map(g => {
          const pubs = PUBLISHERS[st.stage];
          const any = booksFor(g).length > 0;
          return `<div class="grade ${any ? "" : "none"}">
                    <span class="g">${GRADE_NUM[g]}<small>年級</small></span>
                    <div class="pubs">
                      ${pubs.map(p => {
                        const ok = booksFor(g, p).length > 0;
                        return `<button class="pub" type="button"
                                  data-grade="${esc(g)}" data-pub="${esc(p)}" ${ok ? "" : "disabled"}>${esc(PUB_SHORT[p] || p[0])}</button>`;
                      }).join("")}
                    </div>
                  </div>`;
        }).join("")}
      </div>
    </div>`).join("");
  $("stages").querySelectorAll(".pub:not(:disabled)").forEach(btn =>
    btn.onclick = () => go(btn.dataset.grade, btn.dataset.pub));
}

/* ---------- 第二層：版本 → 冊 → 課 ---------- */
function renderGrade(grade, pub){
  const pubs = PUBLISHERS[stageOf(grade)];
  const has = p => booksFor(grade, p).length > 0;
  if (!pub || !has(pub)) pub = pubs.find(has);

  $("crumb").innerHTML = GRADE_NUM[grade] + " 年級 英文課本字表<small>" + esc(grade) + "｜" + esc(YEAR) + "</small>";
  $("tabs").innerHTML = pubs.map(p =>
    `<button class="tab" type="button" role="tab" data-pub="${esc(p)}"
       aria-selected="${p === pub}" ${has(p) ? "" : "disabled"}>${esc(PUB_SHORT[p] || p[0])}</button>`
  ).join("");
  $("tabs").querySelectorAll(".tab:not(:disabled)").forEach(t =>
    t.onclick = () => go(grade, t.dataset.pub));

  $("books").innerHTML = booksFor(grade, pub).map(b => {
    const cards = b.lessons.map(([name, suffix, words]) => {
      const list = words.trim().split(/\s+/);
      return `<a class="lesson" href="${listUrl(b.code + suffix, list)}">
          <div class="lesson-top"><span class="lesson-name">${esc(name)}</span><span class="lesson-count">${list.length} 字</span></div>
          <div class="words">${esc(list.join(", "))}</div>
          <span class="open">開啟字表 →</span>
        </a>`;
    }).join("");
    return `<section class="book">
        <div class="book-head"><h3>${esc(b.title)}（${esc(b.grade + b.term)}）</h3><span class="meta">${esc(b.code)}</span></div>
        <div class="lessons">${cards}</div>
      </section>`;
  }).join("") || `<div class="empty">這個年級還在整理中</div>`;
}

/* ---------- 網址記住位置（可直接分享某年級某版本） ---------- */
function go(grade, pub){
  location.hash = grade ? encodeURIComponent(grade) + (pub ? "/" + encodeURIComponent(pub) : "") : "";
}
function route(){
  const [g, p] = location.hash.slice(1).split("/").map(decodeURIComponent);
  const valid = g && GRADES.some(x => x.items.includes(g)) && booksFor(g).length;
  $("viewGrades").hidden = !!valid;
  $("viewGrade").hidden = !valid;
  if (valid) renderGrade(g, p); else renderGrades();
  window.scrollTo(0, 0);
}
$("backBtn").onclick = () => go("");
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
